<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Todo</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f6fa;
    --surface: #ffffff;
    --border: #e4e6f0;
    --accent: #4f8ef7;
    --green: #34d399;
    --amber: #fbbf24;
    --red: #f87171;
    --text: #1e2140;
    --text2: #6b7099;
    --text3: #b0b4cc;
    --font: 'Noto Sans JP', sans-serif;
    --mono: 'DM Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }

  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 14px 24px; display: flex; align-items: center; justify-content: space-between;
  }
  .logo { font-size: 16px; font-weight: 700; }
  .logo span { color: var(--accent); }
  .user-area { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text2); }
  .btn {
    padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 500;
    cursor: pointer; border: none; font-family: var(--font); transition: opacity .15s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text2); }
  .btn:hover { opacity: .8; }

  .container { max-width: 680px; margin: 32px auto; padding: 0 16px; }

  .notify-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 18px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .notify-card label { font-size: 13px; color: var(--text2); display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .notify-card select {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 4px 8px; font-size: 12px; font-family: var(--font);
  }
  .notify-label { font-size: 12px; font-weight: 500; color: var(--accent); margin-right: 4px; }

  .filter-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab {
    padding: 5px 14px; border-radius: 99px; font-size: 12px; font-weight: 500;
    cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text2);
    transition: all .15s;
  }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .todo-list { display: flex; flex-direction: column; gap: 8px; }
  .todo-item {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; display: flex; align-items: flex-start; gap: 12px;
    transition: border-color .15s;
  }
  .todo-item:hover { border-color: var(--accent); }
  .todo-item.submitted { opacity: .65; }

  .todo-check {
    width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border);
    flex-shrink: 0; margin-top: 2px; cursor: pointer; transition: all .15s;
    display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700;
  }
  .todo-check.done-manual { background: var(--green); border-color: var(--green); color: #fff; }
  .todo-check.done-manual::after { content: '✓'; }
  .todo-check.done-submitted { background: var(--accent); border-color: var(--accent); color: #fff; cursor: default; }
  .todo-check.done-submitted::after { content: '✓'; }

  .todo-body { flex: 1; min-width: 0; }
  .todo-title { font-size: 14px; font-weight: 500; margin-bottom: 3px; line-height: 1.4; }
  .todo-title.done-text { text-decoration: line-through; color: var(--text3); }
  .todo-course { font-size: 11px; color: var(--text3); margin-bottom: 6px; }
  .badges { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .due-badge {
    display: inline-block; font-size: 11px; font-family: var(--mono);
    padding: 2px 8px; border-radius: 99px; font-weight: 500;
  }
  .submitted-badge {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px;
    font-weight: 500; background: #eff6ff; color: #1d4ed8;
  }
  .due-red { background: #fff0f0; color: #d94f4f; }
  .due-amber { background: #fffbeb; color: #b45309; }
  .due-green { background: #f0fdf4; color: #15803d; }
  .due-gray { background: var(--bg); color: var(--text3); }
  .open-link { font-size: 11px; color: var(--accent); text-decoration: none; }
  .open-link:hover { text-decoration: underline; }

  .filter-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .filter-label { font-size: 12px; color: var(--text3); white-space: nowrap; }
  .filter-select {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 6px 10px; font-size: 13px; font-family: var(--font);
    cursor: pointer; flex: 1; min-width: 0;
  }
  .filter-select:focus { outline: none; border-color: var(--accent); }

  .empty { text-align: center; padding: 56px 16px; color: var(--text3); font-size: 14px; line-height: 2; }
  .spinner { width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 12px; }
  .loading-text { color: var(--text3); font-size: 13px; text-align: center; margin-bottom: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #login-screen { max-width: 400px; margin: 80px auto; text-align: center; padding: 0 16px; }
  .login-icon { font-size: 52px; margin-bottom: 16px; }
  .login-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .login-sub { font-size: 14px; color: var(--text2); line-height: 1.8; margin-bottom: 24px; }

  /* テーマカラー */
  .theme-bar {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 18px; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .theme-label { font-size: 12px; font-weight: 500; color: var(--text3); white-space: nowrap; }
  .color-swatch {
    width: 24px; height: 24px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; transition: transform .15s, border-color .15s; flex-shrink: 0;
  }
  .color-swatch:hover { transform: scale(1.15); }
  .color-swatch.active { border-color: var(--text); transform: scale(1.15); }

  /* 追加ボタン */
  .add-btn {
    position: fixed; bottom: 24px; right: 24px;
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--accent); color: #fff; border: none;
    font-size: 24px; cursor: pointer; box-shadow: 0 4px 16px rgba(79,142,247,.4);
    display: flex; align-items: center; justify-content: center;
    transition: opacity .15s; z-index: 100;
  }
  .add-btn:hover { opacity: .85; }

  /* モーダル */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.4);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; padding: 16px;
  }
  .modal {
    background: var(--surface); border-radius: 16px; padding: 24px;
    width: 100%; max-width: 440px; box-shadow: 0 8px 32px rgba(0,0,0,.15);
  }
  .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
  .modal input, .modal textarea, .modal select {
    width: 100%; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-size: 13px; font-family: var(--font);
    color: var(--text); background: var(--bg); margin-bottom: 10px;
  }
  .modal input:focus, .modal textarea:focus, .modal select:focus {
    outline: none; border-color: var(--accent);
  }
  .modal textarea { resize: vertical; min-height: 72px; }
  .modal-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; display: block; }
  .modal-btns { display: flex; gap: 8px; margin-top: 6px; justify-content: flex-end; }
  .custom-badge { background: #f0f4ff; color: #4f8ef7; font-size: 11px; padding: 2px 8px; border-radius: 99px; font-weight: 500; }

  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: #fff; border-radius: 10px;
    padding: 10px 20px; font-size: 13px; opacity: 0; transition: opacity .3s;
    pointer-events: none; white-space: nowrap; z-index: 999;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="logo">Classroom <span>Todo</span></div>
  <div id="header-right">
    <button class="btn btn-primary" onclick="handleLogin()">Googleでログイン</button>
  </div>
</header>

<div id="app"></div>
<button class="add-btn" id="add-btn" onclick="showAddModal()" style="display:none;">+</button>
<div id="toast"></div>

<script>
const CLIENT_ID = '863073003665-i58l6iinif55cr7ji4kjl1cgf3gh4opr.apps.googleusercontent.com';
const SCOPES = [
  'https://www.googleapis.com/auth/classroom.courses.readonly',
  'https://www.googleapis.com/auth/classroom.coursework.me.readonly',
  'https://www.googleapis.com/auth/classroom.student-submissions.me.readonly'
].join(' ');

let tokenClient, accessToken = null;
let courses = [], allTodos = [], manualDoneIds = loadDoneIds(), customTodos = loadCustomTodos();
let filterCourse = 'all', filterStatus = 'pending';
let notifyEnabled = false, notifyDays = 0, notifyHours = 24, notifyMins = 0, notifyTimers = [];

const THEMES = [
  { name: 'ブルー',   accent: '#4f8ef7', bg: '#f0f5ff', surface: '#ffffff', border: '#dae4fb' },
  { name: 'パープル', accent: '#7c5cfc', bg: '#f5f3ff', surface: '#ffffff', border: '#e2dcfd' },
  { name: 'グリーン', accent: '#10b981', bg: '#f0fdf7', surface: '#ffffff', border: '#d1f5e8' },
  { name: 'ピンク',   accent: '#ec4899', bg: '#fff0f7', surface: '#ffffff', border: '#fcd6eb' },
  { name: 'オレンジ', accent: '#f59e0b', bg: '#fffbf0', surface: '#ffffff', border: '#fde9b0' },
  { name: 'レッド',   accent: '#ef4444', bg: '#fff5f5', surface: '#ffffff', border: '#fdd5d5' },
  { name: 'ティール', accent: '#14b8a6', bg: '#f0fdfc', surface: '#ffffff', border: '#ccf2ef' },
  { name: 'インジゴ', accent: '#6366f1', bg: '#f5f5ff', surface: '#ffffff', border: '#dcdcfc' },
];
let currentTheme = parseInt(localStorage.getItem('themeIndex') || '0');

function applyTheme(index) {
  currentTheme = index;
  localStorage.setItem('themeIndex', index);
  const t = THEMES[index];
  let styleEl = document.getElementById('theme-style');
  if (!styleEl) {
    styleEl = document.createElement('style');
    styleEl.id = 'theme-style';
    document.head.appendChild(styleEl);
  }
  styleEl.textContent = `:root {
    --accent: ${t.accent};
    --bg: ${t.bg};
    --surface: ${t.surface};
    --border: ${t.border};
  }`;
  document.body.style.background = t.bg;
  document.querySelectorAll('.color-swatch').forEach((el, i) => {
    el.classList.toggle('active', i === index);
  });
}

function saveCustomTodos() {
  localStorage.setItem('customTodos', JSON.stringify(customTodos));
}
function loadCustomTodos() {
  try {
    const saved = localStorage.getItem('customTodos');
    if (!saved) return [];
    return JSON.parse(saved).map(t => ({ ...t, due: new Date(t.due) }));
  } catch { return []; }
}

function saveDoneIds() {
  localStorage.setItem('manualDoneIds', JSON.stringify([...manualDoneIds]));
}
function loadDoneIds() {
  try {
    const saved = localStorage.getItem('manualDoneIds');
    return saved ? new Set(JSON.parse(saved)) : new Set();
  } catch { return new Set(); }
}

const COLORS = ['#4f8ef7','#7c5cfc','#34d399','#f59e0b','#f87171','#60a5fa','#a78bfa','#f472b6'];

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

function handleLogin() {
  if (!window.google) { showToast('少し待ってから試してください'); return; }
  tokenClient.requestAccessToken();
}

function initGoogle() {
  applyTheme(currentTheme);
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPES,
    callback: async (resp) => {
      if (resp.error) { showToast('ログインに失敗しました'); return; }
      accessToken = resp.access_token;
      renderLoading('授業を読み込み中...');
      await loadCourses();
      renderLoading(`課題と提出状況を読み込み中... (0/${courses.length})`);
      await loadAllTodos();
      renderApp();
    }
  });
}

async function gFetch(url) {
  const r = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
  return r.json();
}

async function loadCourses() {
  const d = await gFetch('https://classroom.googleapis.com/v1/courses?courseStates=ACTIVE');
  courses = d.courses || [];
}

async function loadAllTodos() {
  allTodos = [];
  for (let i = 0; i < courses.length; i++) {
    const c = courses[i];
    renderLoading(`課題と提出状況を読み込み中... (${i+1}/${courses.length})`);

    // 課題一覧を取得
    const wd = await gFetch(`https://classroom.googleapis.com/v1/courses/${c.id}/courseWork`);
    const works = wd.courseWork || [];

    // 提出状況を一括取得
    const sd = await gFetch(`https://classroom.googleapis.com/v1/courses/${c.id}/courseWork/-/studentSubmissions?states=TURNED_IN&states=RETURNED`);
    const submittedIds = new Set((sd.studentSubmissions || []).map(s => s.courseWorkId));

    for (const w of works) {
      if (!w.dueDate) continue;
      const { year, month, day } = w.dueDate;
      // Classroom APIの時刻はUTCなのでUTCとして解釈し日本時間に変換
      const hours = w.dueTime?.hours ?? 23;
      const minutes = w.dueTime?.minutes ?? 59;
      const due = new Date(Date.UTC(year, month - 1, day, hours, minutes));
      allTodos.push({
        id: w.id,
        title: w.title,
        courseId: c.id,
        courseName: c.name,
        due,
        link: w.alternateLink,
        submitted: submittedIds.has(w.id)
      });
    }
  }
  // カスタムTodoをマージ
  for (const t of customTodos) {
    allTodos.push(t);
  }
  allTodos.sort((a, b) => a.due - b.due);
}

function isDone(t) {
  return t.submitted || manualDoneIds.has(t.id);
}

function getDueInfo(due) {
  const diff = due - new Date();
  if (diff < 0) return { label: '期限切れ', cls: 'due-red' };
  const h = Math.floor(diff / 3600000);
  if (h < 24) return { label: `あと${h}時間`, cls: 'due-red' };
  if (h < 48) return { label: `あと${Math.floor(h/24)}日`, cls: 'due-amber' };
  return { label: `あと${Math.floor(h/24)}日`, cls: 'due-green' };
}

function fmtDate(due) {
  return `${due.getMonth()+1}/${due.getDate()} ${String(due.getHours()).padStart(2,'0')}:${String(due.getMinutes()).padStart(2,'0')}`;
}

function renderLoading(msg) {
  document.getElementById('app').innerHTML = `<div class="container"><div class="empty"><div class="spinner"></div><div class="loading-text">${msg}</div></div></div>`;
}

function renderApp() {
  document.getElementById('add-btn').style.display = 'flex';
  document.getElementById('header-right').innerHTML = `
    <div class="user-area">
      <span>ログイン中</span>
      <button class="btn btn-ghost" onclick="reload()">更新</button>
      <button class="btn btn-ghost" onclick="logout()">ログアウト</button>
    </div>`;
  updateApp();
}

function showAddModal() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'add-modal';
  overlay.innerHTML = `
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-title">Todoを追加</div>
      <label class="modal-label">タイトル *</label>
      <input id="new-title" type="text" placeholder="例：レポートを書く">
      <label class="modal-label">メモ（任意）</label>
      <textarea id="new-memo" placeholder="詳細や備考など"></textarea>
      <label class="modal-label">期限 *</label>
      <input id="new-due" type="datetime-local">
      <div class="modal-btns">
        <button class="btn btn-ghost" onclick="closeModal()">キャンセル</button>
        <button class="btn btn-primary" onclick="addCustomTodo()">追加</button>
      </div>
    </div>`;
  overlay.addEventListener('click', closeModal);
  document.body.appendChild(overlay);
  document.getElementById('new-title').focus();
}

function closeModal() {
  const m = document.getElementById('add-modal');
  if (m) m.remove();
}

function addCustomTodo() {
  const title = document.getElementById('new-title').value.trim();
  const memo = document.getElementById('new-memo').value.trim();
  const dueVal = document.getElementById('new-due').value;
  if (!title) { alert('タイトルを入力してください'); return; }
  if (!dueVal) { alert('期限を入力してください'); return; }
  const due = new Date(dueVal);
  const todo = {
    id: 'custom_' + Date.now(),
    title,
    memo,
    courseId: 'custom',
    courseName: '自分のTodo',
    due,
    link: null,
    submitted: false,
    isCustom: true
  };
  customTodos.push(todo);
  saveCustomTodos();
  allTodos.push(todo);
  allTodos.sort((a, b) => a.due - b.due);
  closeModal();
  updateApp();
  showToast('Todoを追加しました');
}

function deleteCustomTodo(id) {
  customTodos = customTodos.filter(t => t.id !== id);
  saveCustomTodos();
  allTodos = allTodos.filter(t => t.id !== id);
  manualDoneIds.delete(id);
  saveDoneIds();
  updateApp();
  showToast('削除しました');
}

function updateApp() {
  const visible = allTodos.filter(t => {
    if (filterCourse !== 'all' && t.courseId !== filterCourse) return false;
    const done = isDone(t);
    if (filterStatus === 'pending') return !done && t.due > new Date();
    if (filterStatus === 'overdue') return !done && t.due <= new Date();
    if (filterStatus === 'done') return done;
    return true;
  });

  // 授業ドロップダウン
  let courseOptions = `<option value="all">すべての授業</option>`;
  courses.forEach(c => {
    courseOptions += `<option value="${c.id}" ${filterCourse===c.id?'selected':''}>${c.name}</option>`;
  });
  const courseTabs = `<div class="filter-row">
    <span class="filter-label">授業</span>
    <select class="filter-select" onchange="setFilterCourse(this.value)">${courseOptions}</select>
  </div>`;

  // ステータスタブ
  const base = allTodos.filter(t => filterCourse==='all' || t.courseId===filterCourse);
  const pendingCount = base.filter(t => !isDone(t) && t.due > new Date()).length;
  const overdueCount = base.filter(t => !isDone(t) && t.due <= new Date()).length;
  const doneCount = base.filter(t => isDone(t)).length;
  const statusTabs = `<div class="filter-tabs">
    <div class="tab ${filterStatus==='pending'?'active':''}" onclick="setFilterStatus('pending')">未完了 (${pendingCount})</div>
    <div class="tab ${filterStatus==='overdue'?'active':''}" onclick="setFilterStatus('overdue')">期限切れ (${overdueCount})</div>
    <div class="tab ${filterStatus==='done'?'active':''}" onclick="setFilterStatus('done')">完了済み (${doneCount})</div>
    <div class="tab ${filterStatus==='all'?'active':''}" onclick="setFilterStatus('all')">すべて</div>
  </div>`;

  // 通知バー
  // 日の選択肢（0〜7日）
  let dayOpts = '';
  for (let d = 0; d <= 7; d++) dayOpts += `<option value="${d}" ${notifyDays===d?'selected':''}>${d}日</option>`;
  // 時間の選択肢（0〜23時間）
  let hourOpts = '';
  for (let h = 0; h <= 23; h++) hourOpts += `<option value="${h}" ${notifyHours===h?'selected':''}>${h}時間</option>`;
  // 分の選択肢（0〜55分、5分おき）
  let minOpts = '';
  for (let m = 0; m <= 55; m += 5) minOpts += `<option value="${m}" ${notifyMins===m?'selected':''}>${m}分</option>`;

  const totalMins = notifyDays * 24 * 60 + notifyHours * 60 + notifyMins;
  const notifyBar = `<div class="notify-card">
    <span class="notify-label">通知</span>
    <label>
      <input type="checkbox" ${notifyEnabled?'checked':''} onchange="toggleNotify(this.checked)">
      期限
    </label>
    <select onchange="setNotifyDays(this.value)">${dayOpts}</select>
    <select onchange="setNotifyHours(this.value)">${hourOpts}</select>
    <select onchange="setNotifyMins(this.value)">${minOpts}</select>
    <span style="font-size:12px;color:var(--text2);">前に通知</span>
  </div>`;

  // Todoリスト
  let listHtml = '';
  if (visible.length === 0) {
    listHtml = `<div class="empty">課題はありません</div>`;
  } else {
    listHtml = `<div class="todo-list">`;
    for (const t of visible) {
      const done = isDone(t);
      const isSubmitted = t.submitted;
      const isManual = manualDoneIds.has(t.id);
      const ci = courses.findIndex(c => c.id === t.courseId);
      const color = COLORS[ci % COLORS.length];
      const dueInfo = getDueInfo(t.due);

      let checkClass = '';
      if (isSubmitted) checkClass = 'done-submitted';
      else if (isManual) checkClass = 'done-manual';

      const clickHandler = isSubmitted ? '' : `onclick="toggleDone('${t.id}')"`;

      listHtml += `
        <div class="todo-item ${done?'submitted':''}">
          <div class="todo-check ${checkClass}" ${clickHandler} title="${isSubmitted?'Classroomで提出済み':isManual?'完了済み（クリックで戻す）':'クリックして完了'}"></div>
          <div class="todo-body">
            <div class="todo-title ${done?'done-text':''}">${t.title}</div>
            <div class="todo-course" style="color:${color}">${t.courseName}</div>
            <div class="badges">
              ${done ? `<span class="due-badge due-gray">${fmtDate(t.due)}</span>` : `<span class="due-badge ${dueInfo.cls}">${dueInfo.label}</span><span class="due-badge due-gray">${fmtDate(t.due)}</span>`}
              ${isSubmitted ? `<span class="submitted-badge">提出済み</span>` : ''}
              ${t.isCustom ? `<span class="custom-badge">自分のTodo</span>` : ''}
              ${t.link ? `<a class="open-link" href="${t.link}" target="_blank">Classroomで開く →</a>` : ''}
              ${t.isCustom ? `<span class="open-link" style="cursor:pointer;color:var(--red);" onclick="event.stopPropagation();deleteCustomTodo('${t.id}')">削除</span>` : ''}
            </div>
            ${t.memo ? `<div style="font-size:11px;color:var(--text3);margin-top:4px;">${t.memo}</div>` : ''}
          </div>
        </div>`;
    }
    listHtml += `</div>`;
  }

  // テーマバー
  const swatches = THEMES.map((t, i) =>
    `<div class="color-swatch ${i===currentTheme?'active':''}" style="background:${t.accent}" title="${t.name}" onclick="applyTheme(${i})"></div>`
  ).join('');
  const themeBar = `<div class="theme-bar">
    <span class="theme-label">テーマカラー</span>
    ${swatches}
  </div>`;

  document.getElementById('app').innerHTML = `<div class="container">
    ${themeBar}${notifyBar}${courseTabs}${statusTabs}
    <div class="todo-list-wrap">${listHtml}</div>
  </div>`;
}

function toggleDone(id) {
  manualDoneIds.has(id) ? manualDoneIds.delete(id) : manualDoneIds.add(id);
  saveDoneIds();
  updateApp();
}
function setFilterCourse(v) { filterCourse = v; updateApp(); }
function setFilterStatus(v) { filterStatus = v; updateApp(); }

async function reload() {
  renderLoading('更新中...');
  await loadCourses();
  customTodos = loadCustomTodos();
  await loadAllTodos();
  renderApp();
  showToast('更新しました');
}

function logout() {
  accessToken = null; courses = []; allTodos = []; manualDoneIds = new Set(); localStorage.removeItem('manualDoneIds');
  document.getElementById('add-btn').style.display = 'none';
  document.getElementById('header-right').innerHTML = `<button class="btn btn-primary" onclick="handleLogin()">Googleでログイン</button>`;
  document.getElementById('app').innerHTML = `<div id="login-screen">
    <div class="login-icon">📚</div>
    <div class="login-title">Classroom Todo</div>
    <div class="login-sub">Google Classroomの課題をまとめて管理。<br>期限前にブラウザ通知でお知らせします。</div>
    <button class="btn btn-primary" style="font-size:15px;padding:12px 32px;" onclick="handleLogin()">Googleアカウントでログイン</button>
  </div>`;
}

async function toggleNotify(enabled) {
  if (!enabled) { notifyEnabled = false; clearTimers(); updateApp(); return; }
  if (!('Notification' in window)) { showToast('このブラウザは通知非対応です'); return; }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { showToast('通知が許可されませんでした'); notifyEnabled = false; updateApp(); return; }
  notifyEnabled = true;
  setupNotifications();
  const lbl = [notifyDays?`${notifyDays}日`:'', notifyHours?`${notifyHours}時間`:'', notifyMins?`${notifyMins}分`:''].filter(Boolean).join('') || '0分'; showToast(`通知をONにしました（${lbl}前）`);
  updateApp();
}
function setNotifyDays(v) { notifyDays = parseInt(v); if (notifyEnabled) setupNotifications(); updateApp(); }
function setNotifyHours(v) { notifyHours = parseInt(v); if (notifyEnabled) setupNotifications(); updateApp(); }
function setNotifyMins(v) { notifyMins = parseInt(v); if (notifyEnabled) setupNotifications(); updateApp(); }
function clearTimers() { notifyTimers.forEach(clearTimeout); notifyTimers = []; }
function setupNotifications() {
  clearTimers();
  const now = Date.now();
  const totalMs = (notifyDays * 24 * 60 + notifyHours * 60 + notifyMins) * 60000;
  if (totalMs === 0) return;
  const label = [notifyDays?`${notifyDays}日`:'', notifyHours?`${notifyHours}時間`:'', notifyMins?`${notifyMins}分`:''].filter(Boolean).join('') || '0分';
  for (const t of allTodos) {
    if (isDone(t)) continue;
    const fireAt = t.due.getTime() - totalMs;
    const delay = fireAt - now;
    if (delay > 0 && delay < 14 * 24 * 3600000) {
      notifyTimers.push(setTimeout(() => {
        new Notification('課題の期限が近づいています', {
          body: `「${t.title}」まであと${label}`,
          icon: 'https://ssl.gstatic.com/classroom/favicon.png'
        });
      }, delay));
    }
  }
}

document.getElementById('app').innerHTML = `<div id="login-screen">
  <div class="login-icon">📚</div>
  <div class="login-title">Classroom Todo</div>
  <div class="login-sub">Google Classroomの課題をまとめて管理。<br>期限前にブラウザ通知でお知らせします。</div>
  <button class="btn btn-primary" style="font-size:15px;padding:12px 32px;" onclick="handleLogin()">Googleアカウントでログイン</button>
</div>`;

window.addEventListener('load', () => {
  applyTheme(currentTheme); // ページ表示直後にテーマを適用
  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client';
  s.onload = initGoogle;
  document.head.appendChild(s);
});
</script>
